models:
  - name: stg_customers
    description: This model stages customer data from the 'jaffle_shop' source, 
      providing essential customer information for further analysis and reporting. 
      It includes unique identifiers and basic personal details of customers.
    columns:
      - name: customer_id
        description: A unique identifier for each customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: The first name of the customer.
        data_tests:
          - not_null
      - name: last_name
        description: The last name of the customer.
        data_tests:
          - not_null


  - name: stg_orders
    description: This model extracts and stages order data from the 'jaffle_shop' source, 
      providing a foundational dataset for order-related analytics. 
      It includes key details such as order identifiers, customer associations, order dates, 
      and current status, facilitating comprehensive order tracking and analysis.
    columns:
      - name: order_id
        description: A unique identifier for each order.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: The identifier for the customer who placed the order.
        tests:
          - not_null
          - relationships:
              arguments:
                field: customer_id
                to: ref('stg_customers')
      - name: order_date
        description: The date when the order was placed.
        tests:
          - not_null
      - name: status
        description: The current status of the order, indicating its progress in the fulfillment process.
        tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['completed','returned','return_pending','placed','shipped']